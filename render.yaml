services:
  - type: web
    name: aura-control-plane
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r render-control-requirements.txt
    startCommand: uvicorn render_control.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AURA_CONTROL_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
