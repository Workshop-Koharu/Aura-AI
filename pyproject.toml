[project]
name = "aura-ai"
version = "0.1.0"
description = "From-scratch local multimodal AI research project"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn", "torch", "numpy", "Pillow", "psutil", "mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
